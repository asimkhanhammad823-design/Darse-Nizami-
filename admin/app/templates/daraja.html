{% extends "base.html" %}
{% block title %}{{ daraja_name }} - Dars-e-Nizami Admin{% endblock %}
{% block content %}
<p><a href="/">&larr; All darajas</a></p>
<h1>{{ daraja_name }} — Books</h1>

<table class="list-table">
  <thead>
    <tr><th>Name</th><th>Sort</th><th></th></tr>
  </thead>
  <tbody>
    {% for b in books %}
    <tr>
      <td><a href="/books/{{ b.id }}?name={{ b.name | urlencode }}&daraja_id={{ daraja_id }}">{{ b.name }}</a></td>
      <td>{{ b.sort_order }}</td>
      <td>
        <form method="post" action="/books/{{ b.id }}/delete" onsubmit="return confirm('Delete this book and everything under it?');">
          <input type="hidden" name="daraja_id" value="{{ daraja_id }}" />
          <button type="submit" class="danger">Delete</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>

<div class="card">
  <h2>Add Book</h2>
  <form method="post" action="/darajas/{{ daraja_id }}/books">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required />
    <label for="sort_order">Sort order</label>
    <input type="number" id="sort_order" name="sort_order" value="0" />
    <button type="submit">Create</button>
  </form>
</div>
{% endblock %}
