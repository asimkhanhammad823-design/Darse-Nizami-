# Builds the student Android APK in the cloud — no Flutter/Android Studio
# needed on your own PC. Run it from the GitHub Actions tab ("Run workflow"),
# then download the APK from the run's "Artifacts" section and share it with
# students (WhatsApp/USB — they enable "install unknown apps" once).
#
# The APK is signed with a debug key, which is fine for direct sharing
# (sideloading). Only Play Store publishing would need a real keystore.

name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      worker_url:
        description: "Worker base URL the app should talk to"
        required: false
        default: "https://dars-worker.ateekkhan-dars.workers.dev"
  push:
    branches: [claude/audio-dars-e-nizami-l5855z]
    paths: ["app/**", ".github/workflows/build-apk.yml"]

permissions:
  contents: write # needed to publish the APK as a release asset

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold the Android project (adds android/ around our Dart code)
        working-directory: app
        run: flutter create --org com.darsenizami --project-name dars_nizami --platforms android .

      - name: Patch Android project (permissions, media service, FLAG_SECURE)
        run: python3 app/tool/patch_android_project.py app/android

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Build release APK
        working-directory: app
        env:
          WORKER_URL: ${{ github.event.inputs.worker_url || 'https://dars-worker.ateekkhan-dars.workers.dev' }}
        run: flutter build apk --release --dart-define=WORKER_BASE_URL=$WORKER_URL

      - name: Rename APK
        run: cp app/build/app/outputs/flutter-apk/app-release.apk dars-nizami.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dars-nizami-apk
          path: dars-nizami.apk
          retention-days: 90

      # Publish to a fixed "app-latest" release so there is a stable PUBLIC
      # download URL (no GitHub login needed), which the landing page links to:
      #   .../releases/download/app-latest/dars-nizami.apk
      - name: Publish APK to public release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Latest App Build
          body: "Latest Dars-e-Nizami student app. Download dars-nizami.apk below."
          files: dars-nizami.apk
