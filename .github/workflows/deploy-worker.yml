# Deploys the Cloudflare Worker (API + hosted admin panel) automatically.
#
# One-time setup (see SETUP.md):
#   GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#   Name:  CLOUDFLARE_API_TOKEN
#   Value: a Cloudflare API token with "Edit Cloudflare Workers" + D1 edit permissions
#          (create at https://dash.cloudflare.com/profile/api-tokens)
#
# After that, every push that touches worker/ deploys itself. You can also
# run it manually from the Actions tab ("Run workflow").

name: Deploy Worker

on:
  workflow_dispatch:
  push:
    branches: [claude/audio-dars-e-nizami-l5855z]
    paths: ["worker/**", ".github/workflows/deploy-worker.yml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Check secret is configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set. See SETUP.md for the one-time setup."
            exit 1
          fi

      - run: npm ci

      - name: Apply D1 migrations (remote)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply dars_db --remote

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
