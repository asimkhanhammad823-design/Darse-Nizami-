name = "dars-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# ---- D1 database binding ----
# Create with: wrangler d1 create dars_db
# Then paste the database_id it prints below.
[[d1_databases]]
binding = "DB"
database_name = "dars_db"
database_id = "914ecfc0-0220-435e-99c8-d04af80eca2d"

# ---- Audio storage: Backblaze B2 (S3-compatible, private bucket) ----
# Not secret (bucket name / endpoint / region are not credentials).
[vars]
B2_ENDPOINT = "s3.us-east-005.backblazeb2.com"
B2_REGION = "us-east-005"
B2_BUCKET = "dars-audio"

# ---- Secrets (do NOT put real values here) ----
# Set these with `wrangler secret put <NAME>`:
#   JWT_SECRET         - random long string, used to sign session tokens
#   B2_KEY_ID          - Backblaze B2 application key ID
#   B2_APPLICATION_KEY - Backblaze B2 application key secret
